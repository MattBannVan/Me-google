name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Typecheck core models
        run: npx --yes typescript@5.4.5 --project core/tsconfig.json --noEmit

      - name: Run core unit tests
        run: node --test core/models/*.test.ts

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for plaintext secrets patterns
        run: |
          if grep -rE '(api[_-]?key|secret|password|token)\s*[:=]\s*["\x27][^"\x27]{8,}' --include='*.ts' --include='*.js' --include='*.md' --include='*.yml' --include='*.yaml' . 2>/dev/null | grep -v 'example\|placeholder\|YOUR_\|xxx' ; then
            echo "Potential secret found"
            exit 1
          fi
          echo "No obvious plaintext secrets detected"
